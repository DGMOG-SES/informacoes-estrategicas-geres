name: Atualizar série de leitos (CNES-LT PE)

on:
  push:
    branches: [main]
    paths:
      - "leitos.R"
      - "utils.R"
      - "indicadores.R"
      - "referencias/dim_indicador.csv"
      - ".github/workflows/atualizar_leitos.yml"
  schedule:
    # Checagem diária (07h37 de Brasília); só baixa quando há competência nova
    # ou republicada no FTP.
    - cron: "37 10 * * *"
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Argumentos extras (ex.: --reprocessar-tudo)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publicar-dados
  cancel-in-progress: false

jobs:
  leitos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::curl
            any::arrow
            any::remotes
            any::jsonlite

      - name: Instalar leitor de .dbc
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript instalar_pacotes.R
          pip install pyreaddbc

      - name: Extrair leitos
        run: Rscript leitos.R ${{ github.event.inputs.argumentos }}

      - name: Gerar indicadores
        run: Rscript indicadores.R

      - name: Publicar no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza série de leitos ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
