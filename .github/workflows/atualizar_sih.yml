name: Atualizar produção hospitalar (SIH PE)

on:
  push:
    branches: [main]
    paths:
      - "producao_sih.R"
      - "utils.R"
      - "referencias/estabelecimentos_validados.csv"
      - ".github/workflows/atualizar_sih.yml"
  schedule:
    # Checagem diária (08h37 de Brasília); só baixa quando há competência nova
    # ou republicada no FTP.
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Argumentos extras (ex.: --reprocessar-tudo)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publicar-dados
  cancel-in-progress: false

jobs:
  sih:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::curl
            any::arrow
            any::remotes
            any::jsonlite

      - name: Instalar leitor de .dbc
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript instalar_pacotes.R
          pip install pyreaddbc

      - name: Extrair produção
        run: Rscript producao_sih.R ${{ github.event.inputs.argumentos }}

      - name: Publicar no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza produção SIH ($(date +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
