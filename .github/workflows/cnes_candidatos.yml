name: Lista candidata de CNES (rede própria estadual)

on:
  push:
    branches: [main]
    paths:
      - "cnes_candidatos.R"
      - ".github/workflows/cnes_candidatos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidatos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::curl
            any::arrow
            any::remotes
            any::jsonlite

      - name: Instalar leitor de .dbc
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript instalar_pacotes.R
          pip install pyreaddbc

      - name: Gerar lista candidata
        run: Rscript cnes_candidatos.R

      - name: Publicar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/referencias
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Atualiza lista candidata de CNES ($(date +%Y-%m-%d))"
            git push
          fi
